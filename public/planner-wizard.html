<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DCP6VS3PT7"></script>
  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>후쿠오사카 예산플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F1EB;
      --primary: #F46C67;
      --primary-strong: #D9524A;
      --text: #2C221D;
      --sub: #7E7067;
      --tertiary: #A2958B;
      --card: #FFFFFF;
      --card-warm: #FFF9F5;
      --border: #E8DDD2;
      --divider: #EEE4DA;
      --disabled: #E9E1D8;
      --selected: #FFF5F3;
      --shadow: 0 10px 24px rgba(62, 39, 24, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; vertical-align: middle; }
    #app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
    }

    .wiz-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: calc(env(safe-area-inset-top) + 12px) 20px 14px;
      background: rgba(247, 241, 235, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 0;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(62, 39, 24, 0.04);
      transition: border-color .16s ease, color .16s ease, transform .16s ease;
    }
    .back-btn:active { transform: scale(.96); }
    .prog-wrap {
      flex: 1;
      display: flex;
      min-width: 0;
      align-items: center;
    }
    .prog-label {
      color: var(--tertiary);
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .step-wrap { padding: 30px 20px 132px; }
    .step-in { animation: stepIn .2s ease; }
    .step-in-rev { animation: stepInRev .2s ease; }
    @keyframes stepIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes stepInRev { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

    .step-title {
      color: var(--text);
      font-size: 28px;
      line-height: 34px;
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 8px;
    }
    .step-sub {
      color: var(--sub);
      font-size: 15px;
      line-height: 22px;
      font-weight: 500;
      margin-bottom: 28px;
    }
    .sec-lbl {
      margin: 28px 0 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }
    .small-label {
      margin: 10px 0 8px;
      color: var(--tertiary);
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }
    .preset-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: -12px 0 20px;
      padding: 7px 11px;
      border: 1px solid #F3D4CF;
      border-radius: 999px;
      background: #FFF5F3;
      color: var(--primary-strong);
      font-size: 12px;
      line-height: 16px;
      font-weight: 800;
    }
    .preset-note {
      margin: 0 0 24px;
      padding: 11px 12px;
      border-radius: 16px;
      background: #FFF8F5;
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 600;
    }
    .preset-note-title {
      margin-bottom: 3px;
      color: var(--sub);
      font-size: 12px;
      line-height: 16px;
      font-weight: 800;
    }
    .preset-note strong {
      color: var(--text);
      font-weight: 800;
    }
    .preset-plan-card {
      margin: -8px 0 20px;
      padding: 15px 16px;
      border: 1px solid #F3D4CF;
      border-radius: 22px;
      background: #FFF7F4;
      box-shadow: 0 10px 22px rgba(91, 48, 34, .05);
    }
    .preset-plan-kicker {
      color: var(--primary-strong);
      font-size: 11px;
      line-height: 15px;
      font-weight: 900;
      letter-spacing: -.01em;
    }
    .preset-plan-title {
      margin-top: 4px;
      color: var(--text);
      font-size: 18px;
      line-height: 24px;
      font-weight: 900;
      letter-spacing: -.05em;
    }
    .preset-plan-meta {
      margin-top: 5px;
      color: var(--sub);
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
    }
    .preset-plan-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 12px;
    }
    .preset-plan-pill {
      border-radius: 14px;
      background: #fff;
      padding: 9px 8px;
      color: var(--sub);
      font-size: 11px;
      line-height: 15px;
      font-weight: 800;
      text-align: center;
      word-break: keep-all;
    }
    .preset-plan-link {
      display: inline-flex;
      margin-top: 12px;
      color: var(--primary-strong);
      font-size: 12px;
      line-height: 16px;
      font-weight: 900;
      text-decoration: none;
    }

    .city-card,
    .stepper-card,
    .pkg-card,
    .info-box,
    .date-summary,
    .assist-card {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .city-card {
      position: relative;
      display: grid;
      width: 100%;
      grid-template-columns: 58px minmax(0, 1fr);
      align-items: start;
      gap: 13px;
      min-height: 124px;
      margin-bottom: 12px;
      padding: 16px 44px 16px 16px;
      border-radius: 24px;
      text-align: left;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .city-card.selected {
      border-color: var(--primary);
      background: var(--selected);
    }
    .city-ico,
    .option-ico {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background:
        radial-gradient(circle at 72% 20%, rgba(255, 255, 255, .78) 0 18%, transparent 19%),
        linear-gradient(145deg, #FFF1ED 0%, #FFE1DA 100%);
      color: var(--primary-strong);
      font-size: 24px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(217, 82, 74, .06);
    }
    .city-ico {
      border-radius: 20px;
      background:
        radial-gradient(circle at 76% 18%, rgba(255, 255, 255, .86) 0 16%, transparent 17%),
        linear-gradient(145deg, #FFF6F2 0%, #FFE2DC 100%);
    }
    .selected .city-ico,
    .pkg-card.selected .option-ico {
      background:
        radial-gradient(circle at 74% 18%, rgba(255, 255, 255, .86) 0 16%, transparent 17%),
        linear-gradient(145deg, #FFE8E2 0%, #FFD4CB 100%);
      box-shadow: inset 0 0 0 1px rgba(217, 82, 74, .12);
    }
    .icon-svg {
      width: 36px;
      height: 36px;
      display: block;
    }
    .city-ico .icon-svg {
      width: 42px;
      height: 42px;
    }
    .city-name {
      padding-top: 2px;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
    }
    .city-sub {
      margin-bottom: 11px;
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 500;
    }
    .city-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 6px;
    }
    .city-tag {
      min-height: 25px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #FBF2EA;
      color: var(--sub);
      font-size: 12px;
      line-height: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .check {
      position: absolute;
      top: 16px;
      right: 16px;
      opacity: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #FFE6DF;
      color: var(--primary);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      text-align: right;
    }
    .selected .check { opacity: 1; }

    .assist-card {
      display: flex;
      width: 100%;
      align-items: flex-start;
      gap: 9px;
      margin-top: 14px;
      padding: 14px 16px;
      border-color: #F3D4CF;
      border-radius: 20px;
      background: #FFF5F3;
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 500;
      box-shadow: none;
    }
    .assist-card span {
      color: var(--primary-strong);
      font-weight: 700;
    }

    .summary-chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 30px;
      margin: -12px 0 26px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--sub);
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .info-box {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      padding: 13px 14px;
      border-radius: 20px;
      border-color: #F3D4CF;
      background: #FFF5F3;
      color: var(--primary-strong);
      font-size: 13px;
      line-height: 19px;
      font-weight: 700;
      box-shadow: none;
    }
    .date-grid,
    .people-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .people-grid.single {
      grid-template-columns: 1fr;
    }
    .people-grid { margin-bottom: 16px; }
    .date-lbl,
    .stpr-lbl {
      margin-bottom: 7px;
      color: var(--sub);
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }
    .date-in,
    .budget-in {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .date-in {
      height: 54px;
      padding: 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    .date-in:focus,
    .budget-in:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(244, 108, 103, .12);
    }
    .date-sub {
      min-height: 16px;
      margin-top: 5px;
      color: var(--tertiary);
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
    }
    .date-summary {
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 20px;
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 600;
      text-align: center;
    }
    .date-summary strong { color: var(--primary-strong); }
    .date-summary.invalid {
      background: #FFF5F3;
      border-color: #F3D4CF;
      color: #D9524A;
    }
    .date-error {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid #F3D4CF;
      border-radius: 15px;
      background: #FFF5F3;
      color: #D9524A;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
    }
    .date-error.show { display: block; }
    .date-guide {
      margin-top: 8px;
      color: var(--sub);
      font-size: 12px;
      line-height: 17px;
      font-weight: 600;
    }

    .night-row,
    .visit-row,
    .airport-row,
    .budget-presets,
    .style-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .night-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .visit-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .nq,
    .apchip,
    .bp,
    .vchip,
    .schip {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--sub);
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
      transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
    }
    .nq {
      position: relative;
      min-height: 52px;
      padding: 7px 4px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 18px;
    }
    .nq-rec {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #FFF5F3;
      color: var(--primary-strong);
      font-size: 10px;
      line-height: 12px;
      font-weight: 800;
      vertical-align: 1px;
    }
    .nq.on .nq-rec {
      background: rgba(255,255,255,.22);
      color: #fff;
    }
    .budget-presets { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:7px; }
    .apchip, .bp, .schip { padding: 0 15px; }
    .bp { min-width:0; padding:0 8px; white-space:nowrap; }
    .vchip { padding: 0 10px; }
    .nq.on,
    .apchip.on,
    .bp.on,
    .vchip.on,
    .schip.on {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .schip:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
    }
    .nq:active,
    .apchip:active,
    .bp:active,
    .vchip:active,
    .schip:active,
    .city-card:active,
    .pkg-card:active { transform: scale(.985); }

    .stepper-card {
      min-height: 96px;
      padding: 16px;
      border-radius: 22px;
    }
    .stpr-row {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      gap: 8px;
    }
    .stpr-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #FBF6F1;
      color: var(--sub);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .stpr-btn.plus {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }
    .stpr-val {
      color: var(--text);
      font-size: 22px;
      line-height: 28px;
      font-weight: 800;
      text-align: center;
    }

    .budget-wrap { position: relative; margin-bottom: 9px; }
    .budget-in {
      height: 58px;
      padding: 0 46px 0 16px;
      font-size: 20px;
      font-weight: 800;
    }
    .budget-in::placeholder { color: #C6BAB2; }
    .budget-unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--sub);
      font-size: 15px;
      font-weight: 700;
    }
    .budget-note {
      margin-bottom: 12px;
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 500;
    }
    .per-person {
      display: none;
      margin: 8px 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--sub);
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }
    .per-person.show { display: block; }
    .per-person strong { color: var(--primary-strong); font-weight: 800; }

    .feas-card {
      margin-top: 14px;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid #F1D6CF;
      background: #FFF8F5;
      box-shadow: 0 8px 18px rgba(62, 39, 24, .04);
    }
    .feas-card.realistic { background: #F7FBF3; border-color: #D9E8D0; }
    .feas-card.tight { background: #FFF8F1; border-color: #F1D7BB; }
    .feas-card.unrealistic,
    .feas-card.impossible { background: #FFF8F5; border-color: #F1D6CF; }
    .feas-kicker {
      color: var(--primary-strong);
      font-size: 11px;
      line-height: 15px;
      font-weight: 900;
      letter-spacing: .02em;
      margin-bottom: 5px;
    }
    .feas-title {
      color: var(--text);
      font-size: 15px;
      line-height: 21px;
      font-weight: 900;
      letter-spacing: -.03em;
    }
    .feas-copy {
      margin-top: 6px;
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 600;
    }
    .feas-basis {
      margin-top: 10px;
      color: var(--tertiary);
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }
    .feas-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .feas-action {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid #F46C67;
      background: #FFFFFF;
      color: var(--primary-strong);
      font-size: 12px;
      line-height: 1;
      font-weight: 900;
    }
    .feas-foot {
      margin-top: 10px;
      color: var(--tertiary);
      font-size: 12px;
      line-height: 17px;
      font-weight: 600;
    }

    .ai-hint,
    .style-limit {
      border-radius: 20px;
      border: 1px solid #F3D4CF;
      background: #FFF5F3;
      color: var(--primary-strong);
      font-size: 13px;
      line-height: 20px;
      font-weight: 700;
    }
    .ai-hint {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-top: 14px;
      padding: 14px;
      min-height: 72px;
      box-shadow: none;
    }
    .style-limit {
      display: none;
      margin-top: 10px;
      padding: 11px 13px;
    }
    .style-limit.show { display: block; }

    .pkg-card {
      display: grid;
      width: 100%;
      grid-template-columns: 56px minmax(0, 1fr) 22px;
      column-gap: 16px;
      align-items: center;
      margin-bottom: 12px;
      padding: 18px;
      border-radius: 24px;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .pkg-card.selected {
      background: var(--selected);
      border-color: var(--primary);
    }
    .info-box + .pkg-card { margin-top: 14px; }
    .pkg-body {
      min-width: 0;
      text-align: left;
    }
    .pkg-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
      justify-content: flex-start;
      color: var(--text);
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
      text-align: left;
    }
    .pkg-sub {
      color: var(--sub);
      font-size: 13px;
      line-height: 19px;
      font-weight: 500;
      text-align: left;
    }
    .pkg-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #FFE6DF;
      color: var(--primary-strong);
      font-size: 11px;
      line-height: 16px;
      font-weight: 800;
      white-space: nowrap;
    }
    .pkg-check {
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
      opacity: 0;
      text-align: right;
    }
    .pkg-card.selected .pkg-check { opacity: 1; }

    .wiz-footer {
      position: fixed;
      bottom: 0;
      left: 50%;
      z-index: 30;
      width: 100%;
      max-width: 430px;
      transform: translateX(-50%);
      min-height: calc(90px + env(safe-area-inset-bottom));
      padding: 14px 20px calc(env(safe-area-inset-bottom) + 20px);
      background: rgba(247, 241, 235, .96);
      border-top: 1px solid var(--divider);
      backdrop-filter: blur(12px);
    }
    .wiz-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 18px;
      background: var(--primary);
      color: #fff;
      font-size: 17px;
      line-height: 22px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(244, 108, 103, .22);
      transition: background .16s ease, color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .wiz-cta:active { transform: scale(.985); }
    .wiz-cta:disabled {
      background: var(--disabled);
      color: var(--tertiary);
      box-shadow: none;
      cursor: not-allowed;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      margin-inline: auto;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      width: min(100%, 430px);
      max-width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 203, 185, .44) 0%, rgba(255, 241, 234, .44) 34%, rgba(255, 248, 244, 0) 66%),
        linear-gradient(180deg, #fffaf6 0%, #fff3ed 54%, #f8ebe2 100%);
      color: #2C221D;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow: hidden;
    }
    #loading-screen.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #app.is-loading #wizard,
    #app.is-loading .prog-wrap { display: none; }
    html.planner-loading,
    body.planner-loading {
      overflow: hidden;
      background: #fffaf6;
    }

    /* Shared control alignment: avoid browser-specific text baselines. */
    .preset-plan-pill,
    .city-tag,
    .nq,
    .apchip,
    .bp,
    .vchip,
    .schip,
    .stpr-btn,
    .feas-action {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nq-rec { vertical-align: middle; }
    .date-in,
    .budget-in { line-height: normal; }
    .plan-loader {
      position: relative;
      width: 124px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plan-loader::before {
      content: "";
      position: absolute;
      inset: 12px 8px;
      border-radius: 999px;
      background: rgba(244, 108, 103, .16);
      filter: blur(18px);
      animation: planGlow 1.9s ease-in-out infinite;
    }
    .plan-orbit {
      position: relative;
      width: 72px;
      height: 42px;
      border-radius: 999px;
      border: 1.5px solid rgba(244, 108, 103, .26);
      background: rgba(255,255,255,.68);
      box-shadow: 0 14px 30px rgba(111, 58, 49, .08);
    }
    .plan-orbit::before,
    .plan-orbit::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      margin-top: -4.5px;
      border-radius: 999px;
      background: #F46C67;
      box-shadow: 0 0 0 6px rgba(244, 108, 103, .12);
      animation: planPulse 1.35s ease-in-out infinite;
    }
    .plan-orbit::before { left: 16px; }
    .plan-orbit::after { right: 16px; animation-delay: .28s; }
    @keyframes planGlow {
      0%, 100% { opacity: .62; transform: scale(.98); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes planPulse {
      0%, 100% { transform: scale(.86); opacity: .7; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .ld-title {
      color: #2C221D;
      font-size: 22px;
      line-height: 29px;
      font-weight: 900;
      text-align: center;
      letter-spacing: -.04em;
      word-break: keep-all;
    }
    .ld-sub {
      max-width: 310px;
      color: #7E7067;
      font-size: 14px;
      line-height: 21px;
      font-weight: 650;
      text-align: center;
      white-space: pre-line;
      word-break: keep-all;
    }
    .ld-progress {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(244,108,103,.16);
      color: #C95B50;
      font-size: 12px;
      line-height: 17px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 10px 22px rgba(111,58,49,.06);
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading-screen" aria-hidden="true">
      <div class="plan-loader" aria-hidden="true">
        <div class="plan-orbit">
        </div>
      </div>
      <div class="ld-title" id="ld-title">예산에 맞는 여행 조합을 찾고 있어요</div>
      <div class="ld-sub">항공권, 숙소, 투어·티켓을 함께 비교하고 있어요</div>
      <div class="ld-progress" id="ld-sub">항공권 후보를 확인하는 중</div>
    </div>

    <div id="wizard">
      <header class="wiz-header">
        <button class="back-btn" id="back-btn" type="button" onclick="goBack()" aria-label="이전">‹</button>
        <div class="prog-wrap">
          <div class="prog-label" id="prog-label">1/5 도시 선택</div>
        </div>
      </header>

      <main id="step-area"></main>

      <footer class="wiz-footer">
        <button class="wiz-cta" id="wiz-cta" type="button" onclick="goNext()">다음 단계</button>
      </footer>
    </div>
  </div>

  <script>
    const F = {
      city: "",
      departDate: "",
      returnDate: "",
      nights: 3,
      origin: "ICN",
      adults: 1,
      children: 0,
      budget: 0,
      budgetPreset: "",
      budgetPerPerson: 0,
      budgetInputMode: "custom",
      nearbyMode: "",
      feasibilityPackageType: "",
      isBudgetManuallyEdited: false,
      styles: [],
      packages: ["flight", "hotel", "tour"],
      entrySource: "",
      templateTitle: "",
      routeStyle: "",
      planType: "",
      recommendedExtras: "",
      nearbyTrip: "",
    };

    let step = 1;
    const TOTAL = 5;
    const STEP_LABELS = ["도시 선택", "일정·출발지", "인원·예산", "여행 스타일", "추천 구성"];
    const PRESET_STEP_LABELS = ["여행 조건 확인", "여행 스타일", "결과 보기"];
    const SAMPLE_PRESET_STEP_LABELS = ["조건 확인", "결과 보기"];
    const ORIGINS = [["ICN", "인천"], ["GMP", "김포"], ["PUS", "부산/김해"], ["CJJ", "청주"], ["CJU", "제주"]];
    const MAX_NIGHTS = 4;
    const STYLE_OPTIONS = [["food", "맛집"], ["shopping", "쇼핑"], ["sightseeing", "관광"], ["family", "가족"], ["onsen", "온천"], ["couple", "커플"], ["solo", "혼자"]];
    const STYLE_LABELS = Object.fromEntries(STYLE_OPTIONS);
    const LEGACY_STYLE_MAP = { healing: "onsen", local: "sightseeing", night: "couple", photo: "sightseeing" };
    const PKG_MAP = {
      all: ["flight", "hotel", "tour"],
      fh: ["flight", "hotel"],
      ht: ["hotel", "tour"],
    };
    const PACKAGE_PRESET_MAP = {
      flight_hotel_tour: ["flight", "hotel", "tour"],
      flight_hotel: ["flight", "hotel"],
      hotel_tour: ["hotel", "tour"],
      // Legacy saved values are folded back into the planner default.
      flight_only: ["flight", "hotel", "tour"],
      hotel_only: ["flight", "hotel", "tour"],
    };
    const BUDGET_PRESETS = {
      budget: {
        id: "budget",
        label: "가성비",
        range: "1인 50~70만원",
        defaultBudgetPerPerson: 600000,
        defaultNights: 2,
        defaultPackageType: "flight_hotel",
        nearbyMode: "light",
        note: "2박3일 추천",
      },
      standard: {
        id: "standard",
        label: "표준",
        range: "1인 80~120만원",
        defaultBudgetPerPerson: 1000000,
        defaultNights: 3,
        defaultPackageType: "flight_hotel_tour",
        nearbyMode: "standard",
        note: "3박4일 추천",
      },
      premium: {
        id: "premium",
        label: "프리미엄",
        range: "1인 150만원+",
        defaultBudgetPerPerson: 1500000,
        defaultNights: 4,
        defaultPackageType: "flight_hotel_tour",
        nearbyMode: "comfort",
        note: "4박5일 추천",
      },
    };
    const KO_DAY = ["일", "월", "화", "수", "목", "금", "토"];

    const FEASIBILITY_MIN = {
      flightRoundTrip: { FUK: 250000, KIX: 280000 },
      hotelNight: { FUK: 85000, KIX: 95000 },
      adultLocalDay: { FUK: 45000, KIX: 50000 },
      tourStyle: {
        sightseeing: 50000,
        family: 40000,
        couple: 40000,
        food: 30000,
        shopping: 25000,
        solo: 25000,
        default: 40000,
      },
    };

    document.addEventListener("DOMContentLoaded", init);

    function normalizeBudgetPresetId(value) {
      return BUDGET_PRESETS[value] ? value : "";
    }

    function travelerWeight() {
      return Math.max(1, F.adults);
    }

    function totalBudgetFromPreset(preset) {
      return Math.round((preset?.defaultBudgetPerPerson || 0) * travelerWeight());
    }

    function roundManwon(value) {
      return Math.round((Number(value) || 0) / 10000) * 10000;
    }

    function formatManwon(value) {
      const amount = Math.max(0, Math.round(Number(value) || 0));
      if (amount >= 10000) return `약 ${Math.round(amount / 10000).toLocaleString("ko-KR")}만원`;
      return `약 ${amount.toLocaleString("ko-KR")}원`;
    }

    function packageTypeFromPackages(packages = F.packages) {
      const key = (packages || []).slice().sort().join("+");
      if (key === "flight+hotel+tour") return "flight_hotel_tour";
      if (key === "flight+hotel") return "flight_hotel";
      if (key === "hotel+tour") return "hotel_tour";
      return "flight_hotel_tour";
    }

    function packagesFromType(packageType) {
      return (PACKAGE_PRESET_MAP[packageType] || PACKAGE_PRESET_MAP.flight_hotel_tour).slice();
    }

    function isPresetFlow() {
      return F.budgetInputMode === "preset" && Boolean(activePreset());
    }

    function isSamplePresetFlow() {
      return isPresetFlow() && (String(F.entrySource || "").startsWith("sample-") || Boolean(F.templateTitle));
    }

    function clearPresetEntryStorage() {
      [
        "plannerBudgetPreset",
        "plannerBudgetInputMode",
        "plannerPackageType",
        "plannerNearbyMode",
        "plannerBudget",
        "plannerNights",
        "plannerCity",
        "plannerStyles",
        "plannerTemplateTitle",
        "plannerRouteStyle",
        "plannerPlanType",
        "plannerRecommendedExtras",
        "plannerNearbyTrip",
        "plannerEntrySource",
      ].forEach((key) => sessionStorage.removeItem(key));
    }

    function clearPresetStateForCustomEntry() {
      F.budgetInputMode = "custom";
      F.entrySource = "";
      F.templateTitle = "";
      F.routeStyle = "";
      F.planType = "";
      F.recommendedExtras = "";
      F.nearbyTrip = "";
      F.budgetPreset = "";
      F.feasibilityPackageType = "";
    }

    function hasExplicitPresetEntry(params) {
      const queryMode = params.get("budgetInputMode");
      return (
        params.has("budgetPreset") ||
        queryMode === "preset" ||
        params.has("templateTitle")
      );
    }

    function totalSteps() {
      if (isSamplePresetFlow()) return 2;
      return isPresetFlow() ? 3 : TOTAL;
    }

    function packageKeyFromPackages(packages = F.packages) {
      const type = packageTypeFromPackages(packages);
      if (type === "flight_hotel_tour") return "all";
      if (type === "flight_hotel") return "fh";
      if (type === "hotel_tour") return "ht";
      return "all";
    }

    function packageTypeIncludes(packageType, kind) {
      return (PACKAGE_PRESET_MAP[packageType] || PACKAGE_PRESET_MAP.flight_hotel_tour).includes(kind);
    }

    function feasibilityPackageType(scope = "current") {
      if (F.feasibilityPackageType) return F.feasibilityPackageType;
      if (scope === "step3") {
        const preset = activePreset();
        if (preset?.defaultPackageType) return preset.defaultPackageType;
      }
      return packageTypeFromPackages(F.packages);
    }

    function checkBudgetFeasibility(options = {}) {
      const packageType = options.packageType || feasibilityPackageType(options.scope);
      const city = F.city || "KIX";
      const nights = Math.max(1, Number(F.nights) || 1);
      const days = nights + 1;
      const adults = Math.max(1, Number(F.adults) || 1);
      const children = 0;
      const totalTravelers = adults;
      const weight = Math.max(1, adults);
      const rooms = totalTravelers <= 3 ? 1 : Math.ceil(totalTravelers / 2);
      const styles = normalizeStyles(F.styles);
      let subtotal = 0;

      if (packageTypeIncludes(packageType, "flight")) {
        subtotal += (FEASIBILITY_MIN.flightRoundTrip[city] || FEASIBILITY_MIN.flightRoundTrip.KIX) * totalTravelers;
      }
      if (packageTypeIncludes(packageType, "hotel")) {
        subtotal += (FEASIBILITY_MIN.hotelNight[city] || FEASIBILITY_MIN.hotelNight.KIX) * rooms * nights;
      }

      if (packageTypeIncludes(packageType, "tour")) {
        const tourPerPerson = Math.max(...(styles.length ? styles : ["default"]).map((style) => {
          if (style === "onsen") return city === "FUK" ? 80000 : 40000;
          return FEASIBILITY_MIN.tourStyle[style] || FEASIBILITY_MIN.tourStyle.default;
        }));
        subtotal += tourPerPerson * totalTravelers;
      }

      const minimumBudget = roundManwon(subtotal);
      const recommendedBudget = roundManwon(minimumBudget * 1.15);
      const totalBudget = Math.max(0, Number(F.budget) || 0);
      const ratio = minimumBudget > 0 ? totalBudget / minimumBudget : 1;
      const shortage = Math.max(0, minimumBudget - totalBudget);
      let status = "realistic";
      if (ratio < 0.75) status = "impossible";
      else if (ratio < 0.95) status = "unrealistic";
      else if (ratio < 1.1) status = "tight";

      const messages = {
        realistic: ["좋은 예산이에요", "현재 조건으로 무리 없이 플랜을 만들기 좋은 예산이에요."],
        tight: ["조금 빠듯하지만 가능해요", "특가 항공권이나 실속 숙소를 활용하면 예산에 맞출 수 있어요."],
        unrealistic: ["이 예산은 조금 낮아요", "현재 조건으로는 예산 초과 가능성이 높아요. 일정이나 추천 구성을 조정하면 더 현실적인 플랜을 만들 수 있어요."],
        impossible: ["현실적인 플랜을 만들기엔 예산이 많이 부족해요", "현재 일정과 구성으로는 입력 예산을 크게 초과할 수 있어요. 예산을 올리거나 일정·구성을 조정하는 것을 추천해요."],
      };

      const suggestions = [];
      if ((status === "unrealistic" || status === "impossible") && nights >= 3) {
        suggestions.push({
          id: "reduce_nights",
          label: "1박 줄이기",
          description: "일정을 1박 줄이면 숙소와 현지 사용 예산을 함께 낮출 수 있어요.",
          actionLabel: "1박 줄이기",
          patchInput: { nights: nights - 1 },
        });
      }
      if ((status === "unrealistic" || status === "impossible") && packageType === "flight_hotel_tour") {
        suggestions.push({
          id: "flight_hotel",
          label: "항공+숙소만 보기",
          description: "투어를 제외하면 예산 부담을 줄이고 현지에서 자유롭게 움직일 수 있어요.",
          actionLabel: "항공+숙소만 보기",
          patchInput: { packageType: "flight_hotel" },
        });
        suggestions.push({
          id: "hotel_tour",
          label: "숙소+투어만 보기",
          description: "항공권을 이미 준비했다면 숙소와 투어 중심으로 예산을 다시 볼 수 있어요.",
          actionLabel: "숙소+투어만 보기",
          patchInput: { packageType: "hotel_tour" },
        });
      }
      if (status === "unrealistic" || status === "impossible") {
        suggestions.push({
          id: "apply_budget",
          label: "추천 예산 적용",
          description: "현재 조건에 맞는 현실 예산으로 다시 계산해요.",
          actionLabel: "추천 예산 적용",
          patchInput: { totalBudget: status === "impossible" ? recommendedBudget : minimumBudget },
        });
      }
      if ((status === "unrealistic" || status === "impossible") && F.budgetPreset !== "budget") {
        suggestions.push({
          id: "budget_mode",
          label: "가성비 모드로 보기",
          description: "가까운 근교와 실속 숙소 중심으로 플랜을 다시 세팅해요.",
          actionLabel: "가성비 모드로 보기",
          patchInput: { budgetPreset: "budget", packageType: "flight_hotel", nearbyMode: "light" },
        });
      }

      return {
        status,
        minimumBudget,
        recommendedBudget,
        totalBudget,
        perPersonBudget: Math.round(totalBudget / weight),
        shortage,
        ratio,
        basisText: `현재 조건에서는 최소 ${formatManwon(minimumBudget)}부터 현실적인 플랜을 만들기 좋아요. 조금 여유롭게 보려면 ${formatManwon(recommendedBudget)} 정도를 추천해요.`,
        title: messages[status][0],
        message: messages[status][1],
        suggestions: suggestions.slice(0, 3),
      };
    }

    function renderBudgetFeasibility(scope = "current") {
      if (!F.budget || !F.city) return "";
      const result = checkBudgetFeasibility({ scope });
      const showActions = result.status === "unrealistic" || result.status === "impossible";
      const scopeText = scope === "step3"
        ? "현재 기본 추천 구성 기준으로 예산을 확인했어요."
        : "최종 추천 구성 기준으로 예산을 다시 확인했어요.";
      return `<div class="feas-card ${result.status}">
        <div class="feas-kicker">예산 현실성 체크</div>
        <div class="feas-title">${result.title}</div>
        <div class="feas-copy">${result.message}</div>
        <div class="feas-basis">${scopeText}<br>${result.basisText}</div>
        ${showActions && result.suggestions.length ? `<div class="feas-suggestions">${result.suggestions.map((item) => `<button class="feas-action" type="button" onclick="applyFeasibilitySuggestion('${item.id}', '${scope}')">${item.actionLabel}</button>`).join("")}</div>` : ""}
        ${showActions ? `<div class="feas-foot">그래도 원하시면 그대로 진행할 수 있어요.</div>` : ""}
      </div>`;
    }

    function refreshFeasibility(scope = step === 3 ? "step3" : "current") {
      const target = document.getElementById(step === 3 ? "budget-feasibility" : "final-feasibility");
      if (target) target.innerHTML = renderBudgetFeasibility(scope);
    }

    function applyFeasibilitySuggestion(id, scope) {
      const suggestion = checkBudgetFeasibility({ scope }).suggestions.find((item) => item.id === id);
      if (!suggestion) return;
      const patch = suggestion.patchInput || {};
      if (patch.nights) {
        F.nights = Math.max(1, Math.min(MAX_NIGHTS, Number(patch.nights)));
        syncReturnFromNights();
      }
      if (patch.packageType) {
        F.packages = packagesFromType(patch.packageType);
        F.feasibilityPackageType = patch.packageType;
      }
      if (patch.totalBudget) {
        F.budget = Number(patch.totalBudget);
        F.budgetPerPerson = Math.round(F.budget / travelerWeight());
        F.isBudgetManuallyEdited = true;
      }
      if (patch.budgetPreset) {
        F.budgetPreset = patch.budgetPreset;
        F.budgetPerPerson = BUDGET_PRESETS[patch.budgetPreset]?.defaultBudgetPerPerson || F.budgetPerPerson;
      }
      if (patch.nearbyMode) F.nearbyMode = patch.nearbyMode;
      if (step === 3) {
        const input = document.getElementById("budget-in");
        if (input) input.value = F.budgetPerPerson ? F.budgetPerPerson.toLocaleString("ko-KR") : "";
        updateBudgetUI();
      } else {
        renderStep(step, "forward");
      }
      updateSummaryChip();
      refreshCta();
    }

    function applyBudgetPreset(presetId) {
      const preset = BUDGET_PRESETS[normalizeBudgetPresetId(presetId)];
      if (!preset) return;
      F.budgetPreset = preset.id;
      F.budgetPerPerson = preset.defaultBudgetPerPerson;
      F.nearbyMode = preset.nearbyMode;
      F.nights = Math.min(MAX_NIGHTS, preset.defaultNights);
      F.packages = PACKAGE_PRESET_MAP[preset.defaultPackageType].slice();
      F.feasibilityPackageType = preset.defaultPackageType;
      F.isBudgetManuallyEdited = false;
      F.budget = totalBudgetFromPreset(preset);
      syncReturnFromNights();
    }

    function activePreset() {
      return BUDGET_PRESETS[normalizeBudgetPresetId(F.budgetPreset)] || null;
    }

    function presetBanner() {
      const preset = activePreset();
      if (!preset) return "";
      const routeStyle = F.routeStyle ? ` · ${F.routeStyle}` : "";
      const duration = ` · ${F.nights}박${F.nights + 1}일 기준`;
      return `<div class="preset-badge">${preset.label} 예산으로 시작 중 · ${preset.range}${routeStyle || duration}</div>`;
    }

    function presetBudgetNote() {
      const preset = activePreset();
      if (!preset) return "";
      const total = totalBudgetFromPreset(preset);
      const travelerText = `여행자 ${F.adults}명`;
      return `
        <div class="preset-note" id="preset-budget-note">
          <div class="preset-note-title">${preset.label} 예산 참고 기준</div>
          <div>1인 <strong>${formatManwon(preset.defaultBudgetPerPerson)}</strong> × ${travelerText} 기준 = 추천 총예산 <strong>${formatManwon(total)}</strong></div>
        </div>
      `;
    }

    function recommendedNightBadge(nights) {
      const preset = activePreset();
      return preset && preset.defaultNights === nights ? `<span class="nq-rec">추천</span>` : "";
    }

    function init() {
      const dep = new Date();
      dep.setDate(dep.getDate() + 45);
      const ret = new Date();
      ret.setDate(ret.getDate() + 48);
      F.departDate = dep.toISOString().slice(0, 10);
      F.returnDate = ret.toISOString().slice(0, 10);

      try {
        const saved = JSON.parse(sessionStorage.getItem("plannerConditions") || "{}");
        if (saved.cityCode) F.city = saved.cityCode;
        if (saved.date) F.departDate = saved.date;
        if (saved.returnDate) F.returnDate = saved.returnDate;
        if (saved.nights) F.nights = Number(saved.nights);
        if (saved.origin) F.origin = saved.origin;
        if (saved.adults) F.adults = Number(saved.adults);
        F.children = 0;
        if (saved.budget) F.budget = Number(saved.budget);
        if (saved.budgetPreset) F.budgetPreset = normalizeBudgetPresetId(saved.budgetPreset);
        if (saved.budgetPerPerson) F.budgetPerPerson = Number(saved.budgetPerPerson);
        else if (saved.budget) F.budgetPerPerson = Math.round(Number(saved.budget) / travelerWeight());
        if (saved.budgetInputMode === "preset" || saved.budgetInputMode === "custom") F.budgetInputMode = saved.budgetInputMode;
        if (saved.nearbyMode) F.nearbyMode = saved.nearbyMode;
        if (saved.feasibilityPackageType) F.feasibilityPackageType = saved.feasibilityPackageType;
        if (typeof saved.isBudgetManuallyEdited === "boolean") F.isBudgetManuallyEdited = saved.isBudgetManuallyEdited;
        if (Array.isArray(saved.styles)) F.styles = normalizeStyles(saved.styles);
        if (Array.isArray(saved.packages)) F.packages = saved.packages;
        if (saved.entrySource) F.entrySource = saved.entrySource;
        if (saved.templateTitle) F.templateTitle = saved.templateTitle;
        if (saved.routeStyle) F.routeStyle = saved.routeStyle;
        if (saved.planType) F.planType = saved.planType;
        if (saved.recommendedExtras) F.recommendedExtras = saved.recommendedExtras;
        if (saved.nearbyTrip) F.nearbyTrip = saved.nearbyTrip;
      } catch (error) {}

      F.children = 0;

      try {
        const params = new URLSearchParams(window.location.search);
        const explicitPresetEntry = hasExplicitPresetEntry(params);
        if (!explicitPresetEntry) {
          clearPresetStateForCustomEntry();
          clearPresetEntryStorage();
        }
        const queryPreset = normalizeBudgetPresetId(params.get("budgetPreset"));
        const sessionPreset = normalizeBudgetPresetId(sessionStorage.getItem("plannerBudgetPreset"));
        const queryMode = params.get("budgetInputMode");
        const sessionMode = sessionStorage.getItem("plannerBudgetInputMode");
        const queryCity = params.get("cityCode");
        const sessionCity = sessionStorage.getItem("plannerCity");
        const queryNights = params.get("nights");
        const sessionNights = sessionStorage.getItem("plannerNights");
        const queryPackageType = params.get("packageType");
        const sessionPackageType = sessionStorage.getItem("plannerPackageType");
        const queryStyles = params.get("styles");
        const sessionStyles = sessionStorage.getItem("plannerStyles");
        const presetBudget = sessionStorage.getItem("plannerBudget");
        F.entrySource = sessionStorage.getItem("plannerEntrySource") || "";
        F.templateTitle = params.get("templateTitle") || sessionStorage.getItem("plannerTemplateTitle") || "";
        F.routeStyle = params.get("routeStyle") || sessionStorage.getItem("plannerRouteStyle") || "";
        F.planType = sessionStorage.getItem("plannerPlanType") || "";
        F.recommendedExtras = params.get("recommendedExtras") || sessionStorage.getItem("plannerRecommendedExtras") || "";
        F.nearbyTrip = sessionStorage.getItem("plannerNearbyTrip") || "";
        if (queryMode === "preset" || sessionMode === "preset") F.budgetInputMode = "preset";
        if (queryMode === "custom" || sessionMode === "custom") F.budgetInputMode = "custom";
        const presetId = queryPreset || sessionPreset;
        if (presetId) {
          applyBudgetPreset(presetId);
          F.budgetInputMode = "preset";
        }
        const overrideCity = queryCity || sessionCity;
        if (overrideCity === "FUK" || overrideCity === "KIX") F.city = overrideCity;
        const overridePackageType = queryPackageType || sessionPackageType;
        if (overridePackageType) {
          F.packages = packagesFromType(overridePackageType);
          F.feasibilityPackageType = packageTypeFromPackages(F.packages);
        }
        const overrideNights = Number(queryNights || sessionNights || 0);
        if (overrideNights) {
          F.nights = Math.min(MAX_NIGHTS, Math.max(1, overrideNights));
          syncReturnFromNights();
        }
        const overrideStyles = queryStyles || sessionStyles;
        if (overrideStyles) F.styles = normalizeStyles(overrideStyles.split(","));
        if (presetId && presetBudget) {
          F.budgetPerPerson = Number(presetBudget);
          F.budget = roundManwon(F.budgetPerPerson * travelerWeight());
        }
        if (!presetId && presetBudget) {
          F.budget = Number(presetBudget);
        }
        clearPresetEntryStorage();
      } catch (error) {}

      if (F.nights > MAX_NIGHTS) {
        F.nights = MAX_NIGHTS;
        syncReturnFromNights();
      }
      normalizeDateRange("init");
      F.styles = normalizeStyles(F.styles);

      renderStep(1, "forward");
      updateProgress();
    }

    function renderStep(nextStep, dir) {
      if ((isPresetFlow() && nextStep === 2) || nextStep === 4) syncSoloStyleForAdults();
      const area = document.getElementById("step-area");
      const cls = dir === "back" ? "step-in-rev" : "step-in";
      const templates = isPresetFlow() ? PRESET_STEP_TEMPLATES : STEP_TEMPLATES;
      area.innerHTML = `<div class="step-wrap ${cls}">${templates[nextStep]()}</div>`;
      injectPresetUi(nextStep);
      if ((!isPresetFlow() && nextStep === 2) || (isPresetFlow() && nextStep === 1)) {
        if (isSamplePresetFlow()) syncReturnFromNights();
        else recalcNights();
        syncDateUI();
      }
      if (!isPresetFlow() && nextStep === 3) updateBudgetUI();
      refreshCta();
    }

    function injectPresetUi(nextStep) {
      const preset = activePreset();
      if (!preset) return;
      const sub = document.querySelector(".step-wrap .step-sub");
      if (sub && !isSamplePresetFlow()) sub.insertAdjacentHTML("afterend", presetBanner());
      if ((!isPresetFlow() && nextStep === 2) || (isPresetFlow() && nextStep === 1)) {
        const rec = document.querySelector(`.nq[data-nights="${preset.defaultNights}"]`);
        if (rec && !rec.querySelector(".nq-rec")) {
          rec.insertAdjacentHTML("afterbegin", `<span class="nq-rec">추천</span>`);
        }
      }
      if (!isPresetFlow() && nextStep === 3) {
        const budgetLabel = document.querySelector(".step-wrap .sec-lbl");
        if (budgetLabel) budgetLabel.insertAdjacentHTML("beforebegin", presetBudgetNote());
      }
    }

    function updateProgress() {
      const count = totalSteps();
      const labels = isSamplePresetFlow() ? SAMPLE_PRESET_STEP_LABELS : isPresetFlow() ? PRESET_STEP_LABELS : STEP_LABELS;
      document.getElementById("prog-label").textContent = `${step}/${count} ${labels[step - 1]}`;
      document.getElementById("back-btn").style.opacity = step === 1 ? ".72" : "1";
    }

    function goNext() {
      if (!canProceed()) return;
      if (step < totalSteps()) {
        step += 1;
        renderStep(step, "forward");
        updateProgress();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        startLoading();
      }
    }

    function goBack() {
      if (step === 1) {
        window.location.href = "/main-home.html";
        return;
      }
      step -= 1;
      renderStep(step, "back");
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function canProceed() {
      if (isSamplePresetFlow()) {
        if (step === 1) return Boolean(F.city && F.departDate && F.returnDate && getDateValidation().valid && F.budget > 0 && F.packages.length);
        return true;
      }
      if (isPresetFlow()) {
        if (step === 1) return Boolean(F.city && F.departDate && F.returnDate && getDateValidation().valid && F.budget > 0 && F.packages.length);
        if (step === 2) return F.styles.length > 0;
        return true;
      }
      if (step === 1) return Boolean(F.city);
      if (step === 2) return Boolean(F.departDate && F.returnDate) && getDateValidation().valid;
      if (step === 3) return F.budget > 0;
      if (step === 4) return F.styles.length > 0;
      if (step === 5) return F.packages.length > 0;
      return true;
    }

    function refreshCta() {
      const btn = document.getElementById("wiz-cta");
      btn.disabled = !canProceed();
      btn.textContent = step === totalSteps() ? "AI 플랜 생성하기" : "다음 단계";
    }

    function cityLabel() {
      if (F.city === "FUK") return "후쿠오카";
      if (F.city === "KIX") return "오사카";
      return "도시 선택";

    function peopleLabel() {
      return `여행자 ${F.adults}명`;
    }

    function summaryText() {
      return `${cityLabel()} · ${F.nights}박 ${F.nights + 1}일 · ${peopleLabel()}`;
    }

    function summaryChip() {
      return `<div class="summary-chip" id="summary-chip">${summaryText()}</div>`;
    }

    function normalizeStyles(styles) {
      const allowed = new Set(STYLE_OPTIONS.map(([value]) => value));
      return [...new Set((styles || []).map((style) => LEGACY_STYLE_MAP[style] || style).filter((style) => allowed.has(style)))].slice(0, 2);
    }

    function syncSoloStyleForAdults() {
      F.styles = normalizeStyles(F.styles);
      if (F.adults === 1) {
        if (!F.styles.includes("solo")) {
          F.styles = ["solo", ...F.styles.filter((style) => !["solo", "family", "couple"].includes(style))].slice(0, 2);
        }
      } else {
        F.styles = F.styles.filter((style) => style !== "solo");
      }
    }

      document.querySelectorAll(".schip").forEach((btn) => {
        const value = btn.dataset.style;
        const isSolo = btn.dataset.style === "solo";
        const isCompanionStyle = value === "family" || value === "couple";
        btn.disabled = (isSolo && (F.adults >= 2 || F.styles.includes("family") || F.styles.includes("couple")))
          || (isCompanionStyle && F.styles.includes("solo"));
        btn.classList.toggle("on", F.styles.includes(btn.dataset.style));
      });
      const hint = document.getElementById("ai-hint-text");
      if (hint) hint.textContent = getAiHint();

    function pickCity(code) {
      F.city = code;

      if (typeof window.gtag === "function") {

          destination:
            code === "FUK"
              ? "fukuoka"
              : code === "KIX"

                : "unknown",
          city_code: code,
          source: "planner_wizard",
          wizard_step: 1,
        });
      }

      document.querySelectorAll(".city-card").forEach((card) => {
        card.classList.toggle("selected", card.dataset.city === code);
      });
      refreshCta();
    }

    function onDepartChange() {
      F.departDate = document.getElementById("d-dep").value;
      if (isSamplePresetFlow()) syncReturnFromNights();
      else normalizeDateRange("depart-change");
      syncDateUI();
      refreshCta();
    }

    function onReturnChange() {
      F.returnDate = document.getElementById("d-ret").value;
      syncReturnBounds();
      if (F.departDate && F.returnDate) recalcNights();
      syncDateUI();
      refreshCta();
    }

    function pickNights(nights) {
      F.nights = clampNights(nights);
      syncReturnFromNights();
      const returnInput = document.getElementById("d-ret");
      if (returnInput) returnInput.value = F.returnDate;
      document.querySelectorAll(".nq").forEach((btn) => {
        btn.classList.toggle("on", Number(btn.dataset.nights) === nights);
      });
      syncDateUI();
      refreshCta();
    }

    function pickOrigin(code) {
      F.origin = code;
      document.querySelectorAll(".apchip").forEach((btn) => {
        btn.classList.toggle("on", btn.dataset.origin === code);
      });
    }

    function syncReturnFromNights() {
      if (!F.departDate) return;
      F.nights = clampNights(F.nights);
      const [year, month, day] = F.departDate.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day + F.nights));
      F.returnDate = date.toISOString().slice(0, 10);
    }

    function addDaysToDate(value, days) {
      if (!value) return "";
      const [year, month, day] = value.split("-").map(Number);
      if (!year || !month || !day) return "";
      const date = new Date(Date.UTC(year, month - 1, day + days));
      return date.toISOString().slice(0, 10);
    }

    function minReturnDate() {
      return addDaysToDate(F.departDate, 1);
    }

    function maxReturnDate() {
      return addDaysToDate(F.departDate, MAX_NIGHTS);
    }

    function clampNights(value) {
      const nights = Number(value);
      if (!Number.isFinite(nights) || nights < 1) return 1;
      return Math.min(MAX_NIGHTS, Math.max(1, Math.round(nights)));
    }

    function syncReturnBounds() {
      const returnInput = document.getElementById("d-ret");
      if (!returnInput || !F.departDate) return;
      returnInput.min = minReturnDate();
      returnInput.max = maxReturnDate();
    }

    function normalizeDateRange(reason = "sync") {
      if (!F.departDate) return;
      const previousNights = clampNights(F.nights || 1);
      let nextNights = previousNights;
      if (reason !== "depart-change" && F.returnDate) {
        const depart = dateToUtc(F.departDate);
        const ret = dateToUtc(F.returnDate);
        if (depart !== null && ret !== null) {
          nextNights = clampNights(Math.round((ret - depart) / 86400000));
        }
      }
      F.nights = nextNights;
      syncReturnFromNights();
      syncReturnBounds();
    }

    function dateToUtc(value) {
      if (!value) return null;
      const [year, month, day] = value.split("-").map(Number);
      if (!year || !month || !day) return null;
      return Date.UTC(year, month - 1, day);
    }

    function getDateValidation() {
      const depart = dateToUtc(F.departDate);
      const ret = dateToUtc(F.returnDate);
      if (depart === null || ret === null) return { valid: false, diff: 0, message: "" };
      const diff = Math.round((ret - depart) / 86400000);
      if (diff < 0) {
        return { valid: false, diff, message: "복귀일은 출발일보다 이후 날짜로 선택해주세요." };
      }
      if (diff === 0) {
        return { valid: false, diff, message: "당일치기 일정은 아직 지원하지 않아요. 최소 1박 2일부터 선택해주세요." };
      }
      if (diff > MAX_NIGHTS) {
        return { valid: false, diff, message: "현재 AI 일정은 최대 4박 5일까지 제공돼요. 날짜를 줄여 다시 선택해주세요." };
      }
      return { valid: true, diff, message: "" };
    }

    function recalcNights(options = {}) {
      const depart = dateToUtc(F.departDate);
      const ret = dateToUtc(F.returnDate);
      if (depart === null || ret === null) return;
      const diff = Math.round((ret - depart) / 86400000);
      if (diff > 0 && diff <= MAX_NIGHTS) {
        F.nights = diff;
      }
      if (options.updateButtons === false) return;
      document.querySelectorAll(".nq").forEach((btn) => {
        btn.classList.toggle("on", Number(btn.dataset.nights) === F.nights);
      });
    }

    function fmtDate(value) {
      if (!value) return "";
      const date = new Date(`${value}T00:00:00`);
      return `${value.slice(5).replace("-", "/")}(${KO_DAY[date.getDay()]})`;
    }

    function syncDateUI() {
      const depSub = document.getElementById("dep-sub");
      const retSub = document.getElementById("ret-sub");
      const summary = document.getElementById("date-summary");
      const error = document.getElementById("date-error");
      const departInput = document.getElementById("d-dep");
      const returnInput = document.getElementById("d-ret");
      const validation = getDateValidation();
      if (departInput && departInput.value !== F.departDate) departInput.value = F.departDate;
      if (returnInput) {
        returnInput.min = minReturnDate();
        returnInput.max = maxReturnDate();
        if (returnInput.value !== F.returnDate) returnInput.value = F.returnDate;
      }
      if (depSub) depSub.textContent = fmtDate(F.departDate);
      if (retSub) retSub.textContent = fmtDate(F.returnDate);
      if (summary) {
        summary.classList.toggle("invalid", !validation.valid);
        summary.innerHTML = validation.valid
          ? `${fmtDate(F.departDate)} → ${fmtDate(F.returnDate)} · <strong>${validation.diff}박 ${validation.diff + 1}일</strong>`
          : "날짜를 다시 선택해주세요";
      }
      if (error) {
        error.textContent = validation.message;
        error.classList.toggle("show", Boolean(validation.message));
      }
    }

    function stepPeople(key, delta) {
      if (key !== "adults") return;
      F[key] = Math.max(1, Math.min(10, F[key] + delta));
      const preset = activePreset();
      if (F.budgetPerPerson > 0) {
        F.budget = roundManwon(F.budgetPerPerson * travelerWeight());
      }
      const value = document.getElementById(`v-${key}`);
      if (value) value.textContent = F[key];
      const budgetInput = document.getElementById("budget-in");
      if (budgetInput && preset && !F.isBudgetManuallyEdited) {
        budgetInput.value = F.budgetPerPerson ? F.budgetPerPerson.toLocaleString("ko-KR") : "";
      }
      const presetNote = document.getElementById("preset-budget-note");
      if (presetNote) presetNote.outerHTML = presetBudgetNote();
      syncSoloStyleForAdults();
      updateStyleButtons();
      updateBudgetUI();
      updateSummaryChip();
    }

    function onBudgetInput(input) {
      const raw = input.value.replace(/[^0-9]/g, "");
      F.budgetPerPerson = Number(raw) || 0;
      F.budget = roundManwon(F.budgetPerPerson * travelerWeight());
      F.isBudgetManuallyEdited = true;
      input.value = F.budgetPerPerson ? F.budgetPerPerson.toLocaleString("ko-KR") : "";
      document.querySelectorAll(".bp").forEach((btn) => btn.classList.remove("on"));
      updateBudgetUI();
      refreshCta();
    }

    function pickBudget(value) {
      F.budgetPerPerson = value;
      F.budget = roundManwon(value * travelerWeight());
      F.isBudgetManuallyEdited = true;
      const input = document.getElementById("budget-in");
      if (input) input.value = value.toLocaleString("ko-KR");
      document.querySelectorAll(".bp").forEach((btn) => btn.classList.toggle("on", btn.textContent.replace(/[^0-9]/g, "") === String(value / 10000)));
      updateBudgetUI();
      refreshCta();
    }

    function updateBudgetUI() {
      const note = document.getElementById("per-person-note");
      if (!note) return;
      const weight = travelerWeight();
      if (!F.budget) {
        note.classList.remove("show");
        note.textContent = "";
        refreshFeasibility("step3");
        return;
      }
      const perPerson = Math.round(F.budgetPerPerson || F.budget / weight).toLocaleString("ko-KR");
      const total = Math.round(F.budget).toLocaleString("ko-KR");
      note.classList.add("show");
      note.innerHTML = `1인 약 <strong>${perPerson}원</strong> · ${weight}명 전체 약 <strong>${total}원</strong>`;
      refreshFeasibility("step3");
    }

    function toggleStyle(value) {
      if ((value === "solo" && (F.adults >= 2 || F.styles.includes("family") || F.styles.includes("couple")))
        || ((value === "family" || value === "couple") && F.styles.includes("solo"))) {
        const notice = document.getElementById("style-limit");
        if (notice) {
          notice.textContent = value === "solo"
            ? "가족/커플 여행과 '혼자' 성향은 함께 선택할 수 없어요."
            : "'혼자' 성향이 선택된 상태에서는 가족/커플을 선택할 수 없어요.";
          notice.classList.add("show");
          window.setTimeout(() => {
            notice.textContent = "여행 성향은 최대 2개까지 선택할 수 있어요.";
            notice.classList.remove("show");
          }, 1800);
        }
        return;
      }
      const index = F.styles.indexOf(value);
      const notice = document.getElementById("style-limit");
      if (index >= 0) {
        F.styles.splice(index, 1);
      } else if (F.styles.length >= 2) {
        if (notice) {
          notice.classList.add("show");
          window.setTimeout(() => notice.classList.remove("show"), 1800);
        }
        return;
      } else {
        F.styles.push(value);
      }
      syncSoloStyleForAdults();
      updateStyleButtons();
      refreshCta();
    }

    function getAiHint() {
      const pair = [...F.styles].sort().join("+");
      if (pair === "food+shopping") return "중심 상권 접근성이 좋은 숙소와 자유시간을 고려해 추천해요.";
      if (pair === "family+onsen") return "이동 부담이 적은 숙소와 온천/휴식 코스를 우선 추천해요.";
      if (pair === "couple+sightseeing") return "대표 관광지와 분위기 좋은 야간 동선을 함께 고려해요.";
      if (pair === "food+sightseeing") return "대표 관광지와 맛집 동선을 함께 반영해요.";
      if (pair === "family+shopping") return "이동이 편한 중심 지역 숙소와 쇼핑 동선을 우선 고려해요.";
      if (pair === "shopping+solo") return "혼자 이동하기 쉬운 중심 상권과 자유시간을 고려해요.";
      if (F.styles.length === 1) {
        const single = F.styles[0];
        const singleHints = {
          food: "맛집 접근성이 좋은 숙소 위치와 자유시간을 고려해요.",
          shopping: "쇼핑 동선이 편한 중심 지역 숙소를 우선 추천해요.",
          sightseeing: "대표 관광지와 이동 효율이 좋은 동선을 우선 추천해요.",
          family: "이동 부담이 적고 편의성이 좋은 구성을 우선 추천해요.",
          onsen: "근교 온천과 휴식 시간을 고려해 예산을 배분해요.",
          couple: "분위기 좋은 야경과 여유로운 자유시간을 반영해요.",
          solo: "혼자 이동하기 쉬운 중심 동선과 자유시간을 고려해요.",
        };
        return singleHints[single] || "선택한 취향을 중심으로 숙소와 투어를 추천해요.";
      }
      return "선택한 여행 성향을 중심으로 숙소와 투어를 추천해요.";
    }

    function pickPackage(key) {
      F.packages = (PKG_MAP[key] || PKG_MAP.all).slice();
      F.feasibilityPackageType = packageTypeFromPackages(F.packages);
      document.querySelectorAll(".pkg-card").forEach((card) => {
        card.classList.toggle("selected", card.dataset.package === key);
      });
      refreshFeasibility("current");
      refreshCta();
    }

    async function startLoading() {
      const dateValidation = getDateValidation();
      if (!dateValidation.valid) return;
      F.nights = dateValidation.diff;
      if (!F.styles.length) F.styles = ["sightseeing"];
      const feasibility = checkBudgetFeasibility({ scope: "current" });
      if (feasibility.status === "impossible") {
        const proceed = window.confirm("현재 조건은 예산 초과 가능성이 높아요. 그래도 플랜을 생성할까요?");
        if (!proceed) return;
      }
      const loadingMessages = [
        "항공권 후보를 확인하는 중",
        "숙소 예산 균형을 맞추는 중",
        "투어·티켓 추천을 정리하는 중",
        "일정 뼈대를 만드는 중",
      ];
      let loadingIndex = 0;
      const loadingTitle = document.getElementById("ld-title");
      const loadingSub = document.getElementById("ld-sub");
      loadingTitle.textContent = "예산에 맞는 여행 조합을 찾고 있어요";
      loadingSub.textContent = loadingMessages[loadingIndex];

      const conditions = {
        cityCode: F.city,
        date: F.departDate,
        returnDate: F.returnDate,
        nights: F.nights,
        origin: F.origin,
        adults: F.adults,
        children: 0,
        budget: F.budget,
        budgetPreset: F.budgetPreset,
        budgetPerPerson: F.budgetPerPerson,
        budgetInputMode: F.budgetInputMode,
        nearbyMode: F.nearbyMode,
        feasibilityPackageType: F.feasibilityPackageType,
        isBudgetManuallyEdited: F.isBudgetManuallyEdited,
        styles: F.styles,
        packages: F.packages,
        entrySource: F.entrySource,
        templateTitle: F.templateTitle,
        routeStyle: F.routeStyle,
        planType: F.planType,
        recommendedExtras: F.recommendedExtras,
        nearbyTrip: F.nearbyTrip,
      };
      sessionStorage.setItem("plannerConditions", JSON.stringify(conditions));
      sessionStorage.setItem("plannerBudget", String(F.budget));

      const app = document.getElementById("app");
      const loadingScreen = document.getElementById("loading-screen");
      document.documentElement.classList.add("planner-loading");
      document.body.classList.add("planner-loading");
      app.classList.add("is-loading");
      loadingScreen.setAttribute("aria-hidden", "false");
      loadingScreen.classList.add("show");
      const loadingTimer = window.setInterval(() => {
        loadingIndex = (loadingIndex + 1) % loadingMessages.length;
        loadingSub.textContent = loadingMessages[loadingIndex];
      }, 1250);
      try {
        const summaryRequest = fetch("/api/planner/summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conditions),
        });
        const summaryRes = await Promise.race([
          summaryRequest,
          new Promise((resolve) => window.setTimeout(() => resolve(null), 1200)),
        ]);
        if (summaryRes && summaryRes.ok) {
          const summaryData = await summaryRes.json();
          sessionStorage.setItem("plannerPlanInput", JSON.stringify(summaryData.planInput));
          sessionStorage.setItem("plannerPlanSummary", JSON.stringify(summaryData.planSummary));
        }
      } catch (error) {}
      window.setTimeout(() => {
        window.clearInterval(loadingTimer);
        const params = new URLSearchParams({
          cityCode: F.city,
          date: F.departDate,
          returnDate: F.returnDate,
          nights: String(F.nights),
        });
        window.location.href = `/planner-result.html?${params.toString()}`;
      }, 900);
    }
  </script>
</body>
